services:
  server:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/app
    depends_on:
      - php
    networks:
      - app-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    volumes:
      - .:/app
    networks:
      - app-network

  # Zadania cykliczne (docker/cron/crontab) na tym samym obrazie co php. crond nie przekazuje zadaniom
  # zmiennych kontenera (.env: baza, SMTP), więc przy starcie zapisujemy je do /etc/cron.env, który
  # zadanie wczytuje. tr usuwa CRLF – crontab z repozytorium mógł dostać windowsowe końce linii.
  cron:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    volumes:
      - .:/app
    # Pojedynczy cudzysłów YAML nie interpretuje „\” – znak CR podajemy ósemkowo (\015) dla tr.
    command: ['sh', '-c', 'export -p > /etc/cron.env && tr -d "\015" < /app/docker/cron/crontab > /etc/crontabs/root && crond -f -l 8']
    depends_on:
      - db
      - mailpit
    networks:
      - app-network

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/db:/docker-entrypoint-initdb.d
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - app-network

networks:
  app-network:

volumes:
  pg-data: