server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php index.html;

    # Domyślny limit nginx (1 MB) odrzuciłby zwykłe zdjęcie z telefonu. Aplikacja przyjmuje do 5 MB
    # (PhotoUploadService::MAX_BYTES); zapas do 8 MB sprawia, że za duży plik dostaje czytelny komunikat z PHP.
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pliki od użytkowników: tylko statyczne serwowanie. ^~ ma pierwszeństwo przed regułą .php niżej,
    # więc nawet podrzucony skrypt nie zostanie przekazany do PHP-FPM.
    location ^~ /uploads/ {
        add_header X-Content-Type-Options nosniff;
        location ~ \.php$ {
            deny all;
        }
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}